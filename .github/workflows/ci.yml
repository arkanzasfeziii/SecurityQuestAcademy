name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy games/ standalone/ securityquest/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/ -v --tb=short --cov=securityquest --cov=games --cov=standalone --cov-report=term-missing --cov-fail-under=90

  build:
    name: Package build & install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -c "from securityquest.cli import main; from games import ciscoquest, cryptoquest, reversequest, webhackquest; from standalone import Cyberquest, Bashquest, Windowsquest; print('package imports OK')"
      - run: securityquest < /dev/null

  docker:
    name: Docker build & run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t securityquest-academy .
      - run: docker run --rm securityquest-academy < /dev/null

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt || true
      - run: pip-audit -r requirements-dev.txt || true
      - run: bandit -r games/ standalone/ securityquest/ -ll || true
